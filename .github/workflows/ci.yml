# CI seed (flexible-workflows plan, Slice 0.5-7 / Technical Plan §25 prerequisite).
# Runs type-check, lint, skill + migration + documentation-link validation and
# the chained selftests on every PR and on pushes to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history: the frozen-path check diffs base..head.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # CHANGE invariant. validate:migrations checks that the chain matches the
      # manifest, but that alone is defeatable: edit a frozen migration, then
      # regenerate the manifest, and the content check passes again. This check
      # fails on the diff instead, so a coordinated migration+manifest edit
      # cannot land through a normal change. There is no override flag —
      # changing the frozen era is auditable repository maintenance.
      - name: Frozen legacy era is immutable (change invariant)
        run: |
          node scripts/check-frozen-paths.mjs \
            "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}" \
            "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"

      - name: Validate skills
        run: npm run validate:skills

      # Also enforces the B′ migration eras: the frozen legacy set by exact
      # file set + content hash, and forward-era structure/version uniqueness.
      - name: Validate migrations (frozen legacy integrity + forward era)
        run: npm run validate:migrations

      - name: Validate model price catalog
        run: npm run validate:model-price-catalog

      # Documentation authority is expressed as links: docs/README.md routes
      # every question to its owning artifact, so a link that stops resolving
      # turns the authority map into a confident wrong answer. PR #5 repaired 39
      # of them; this keeps the repaired state enforceable. Not in `prebuild` —
      # reference integrity is a CI concern, not a product build concern.
      - name: Validate documentation links
        run: npm run validate:doc-links

      # Process invariant, not a semantic one. The architecture documentation
      # coherence audit (#32–#35) repaired canonical current-state documents
      # that had drifted from the system they describe; the rule requiring that
      # repair already existed in AGENTS.md §8. What was missing was a moment
      # where somebody is asked, on the record, which claims a change
      # invalidated. This checks that the assessment EXISTS — never that it is
      # correct, which needs judgment a validator cannot supply without
      # manufacturing false confidence. `none` with a real rationale passes.
      #
      # Reads the PR body from the event payload JSON on disk, so author-
      # controlled text never reaches a shell. Skips cleanly on push, where
      # there is no PR body to read.
      - name: Architecture documentation impact declared (process invariant)
        run: npm run check:architecture-impact

      - name: Type-check
        run: npm run type-check

      # Lint is non-blocking until the pre-existing errors listed in the
      # implementation plan §X are burned down; flip to blocking afterwards.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Selftests
        run: npm run test:selftests

  # Cross-tenant / RLS suite (R1 Technical Plan §8). Separate job because it is
  # the only one that needs a database: row-level security, permissive/
  # restrictive composition and SECURITY DEFINER behaviour are PostgreSQL
  # semantics and cannot be verified against the in-memory fake client the
  # other DB selftests use. The `ci` job above stays database-free.
  rls:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # pgvector, not plain postgres: migration 00005 creates the `vector`
        # extension and match_memories takes vector(1536).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gu_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Rebuilds a fresh database through BOTH eras — frozen legacy chain then
      # forward-only era — and runs the cross-tenant suite against the result,
      # so CI keeps testing the schema an environment actually composes.
      - name: Fresh rebuild (legacy → forward) + cross-tenant / RLS suite
        run: npm run test:rls
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/gu_os_test
